ENABLE_E2EGL = "${@bb.utils.contains_any("MACHINEBUILD", "ax61 dm900 dm920 gbip4k gbquad4k gbquad4kpro gbtrio4k gbtrio4kpro gbue4k pulse4k pulse4kmini sf8008 sf8008m zgemmah7 zgemmah17combo zgemmah17twin zgemmah8se zgemmah92h zgemmah92s zgemmah9s zgemmah9splus zgemmah9t zgemmah9combo zgemmah9twin zgemmah9combose zgemmah9twinse zgemmah92hse zgemmah9sse zgemmah102h zgemmah102s zgemmah10combo zgemmai55plus zgemmai55se zgemmah112h zgemmah11s vuduo4k vuduo4kse vuduo4klite vusolo4k vuultimo4k vuuno4k vuuno4kse vuzero4k", "1", "0", d)}"

# Suppress skins1440, except on machines that can take a 1440p canvas as is.
# pulse4k/pulse4kmini/ax61/sf8008/sf8008m/gbip4k/gbtrio4k/gbtrio4kpro and the Zgemma
# HiSilicon boxes stay suppressed: the Mali-450 could take it, but hifb
# (/dev/fb0) refuses anything above 1920x1080 (FBIOPUT_VSCREENINFO returns EPERM
# for 2560x1440 and 3840x2160, verified on device). Setting it also keeps
# enigma2.bbappend from adding --enable-egl-canvas-scaling on these machines.
E2EGL_WQHD_FEATURE = "${@bb.utils.contains_any('MACHINEBUILD', 'gbquad4k gbquad4kpro gbue4k vuduo4k vuduo4klite vuuno4k vuuno4kse vuzero4k', 'skins1440', '', d)}"
