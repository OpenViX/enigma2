# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*.bb ${LAYERDIR}/recipes-*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# Per-MACHINEBUILD private recipes/appends: recipes-local/machine-<MACHINEBUILD>/...
# are only added to BBFILES (and so only ever parsed) when that exact MACHINEBUILD is
# being built. This keeps a bbappend for a machine-specific recipe (e.g. a recipe that
# only exists in a brand layer not loaded for other receivers) from being a dangling
# append and breaking every other receiver's build.
BBFILES += "${@bb.utils.contains_any('MACHINEBUILD', 'gbquad4kpro gbquad4k gbue4k', '${LAYERDIR}/recipes-local/machine-gb7252/*/*.bb ${LAYERDIR}/recipes-local/machine-gb7252/*/*.bbappend', '', d)}"
BBFILES += "${@bb.utils.contains_any('MACHINEBUILD', 'vuduo4klite', '${LAYERDIR}/recipes-local/machine-vuduo4klite/*/*.bb ${LAYERDIR}/recipes-local/machine-vuduo4klite/*/*.bbappend', '', d)}"

BBFILE_COLLECTIONS += "local-layer"
BBFILE_PATTERN_local-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_local-layer = "100"

LAYERSERIES_COMPAT_local-layer = "wrynose blacksail"
